        @font-face {
            font-family: 'Jes CMU';
            src: url('fonts/Jes_cmu-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'caps';
            src: url('fonts/Caps-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'jesfont2';
            src: url('fonts/JesFont2-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Jes CMU';
            background-color: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        footer {
            margin-top: auto;
        }

        header {
            padding: 40px 60px;
            border-bottom: 1px solid #e0e0e0;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 img {
            height: 90px;
            width: auto;
            display: block;
        }

        nav {
            margin-top: 20px;
        }

        nav a {
            margin-right: 30px;
            text-decoration: none;
            color: #666;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #333;
        }

        nav a.active {
            color: #333;
            font-weight: 600;
        }

        .gallery {
            padding: 60px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(clamp(200px, 30%, 400px), 1fr));
            gap: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .product-card {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            background-color: #ffffff;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .sold-out-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 16px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .product-info {
            margin-top: 20px;
            text-align: center;
        }

        .product-title {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #333;
        }

        .product-price {
            font-size: 0.95rem;
            color: #666;
        }

        .product-medium {
            font-size: 0.85rem;
            color: #999;
            margin-top: 5px;
            font-style: italic;
        }

        /* ── MODAL ── */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.98);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            flex-direction: column;
        }

        .modal-scrollable {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 0;
        }

        .modal-nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background-color: transparent;
            border: none;
            width: 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.3s;
            z-index: 1002;
            font-size: 36px;
            color: #333;
            font-weight: 300;
        }

        .modal-nav-arrow:hover { opacity: 0.6; }

        .modal-nav-arrow.disabled {
            opacity: 0.2;
            cursor: not-allowed;
            pointer-events: none;
        }

        .modal-nav-arrow.prev { left: 30px; }
        .modal-nav-arrow.next { right: 30px; }

        .modal-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 60px 40px;
            width: 100%;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #333;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-link img { height: 16px; width: auto; }
        .back-link:hover { color: #666; }

        .product-detail {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 60px;
            align-items: start;
        }

        .product-image-section { width: 100%; }

        .product-image-large {
            width: 100%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .product-image-large img {
            max-width: 100%;
            max-height: 75vh;
            width: auto;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .image-thumbnails {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.3s;
            overflow: hidden;
            background-color: #f5f5f5;
        }

        .thumbnail.active { border-color: #6B9BD1; }
        .thumbnail:hover { border-color: #999; }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-details { position: relative; }

        .product-details h2 {
            font-size: 1.8rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .detail-price {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 30px;
        }

        .detail-description {
            color: #666;
            line-height: 1;
            margin-bottom: 15px;
        }

        .detail-size { color: #666; margin-bottom: 15px; }
        .detail-medium { color: #666; margin-bottom: 30px; }

        .add-to-cart-btn {
            background-color: #6B9BD1;
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 0.85rem;
            font-family: 'Jes CMU';
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: background-color 0.3s;
            display: inline-block;
            width: auto;
            text-decoration: none;
        }

        .add-to-cart-btn:hover { background-color: #5a8bc4; }

        .add-to-cart-btn.sold-out-btn {
            background-color: #888;
        }

        .add-to-cart-btn.sold-out-btn:hover {
            background-color: #666;
        }

        /* Modal footer uses the shared footer style */
        .modal-footer {
            flex-shrink: 0;
            z-index: 1001;
        }

          /* ── SHARED SITE FOOTER ── */
        .site-footer {
            background-color: #ffffff;
            border-top: 1px solid #ffffff;
            padding: 22px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-footer .footer-copy {
            font-size: 0.82rem;
            color: #888;
            letter-spacing: 0.01em;
        }

        .site-footer .footer-right {
            display: flex;
            align-items: center;
            gap: 27px;
        }

        .site-footer .footer-email {
            font-family: 'caps';
            font-size: 1rem;
            text-transform: uppercase;
            color: #c46b3a;
            text-decoration: none;
            letter-spacing: 0.01em;
            transition: color 0.2s;
        }

        .site-footer .footer-email:hover {
            color: #222;
        }

        .site-footer .footer-socials {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .site-footer .footer-socials a {
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .site-footer .footer-socials img {
            height: 30px;
            width: auto;
            object-fit: contain;
            display: block;
            transition: opacity 0.3s;
        }

        /* ─────────────────────────────────────────────
           FROG ANIMATION
           ─ Only visible when the ceramics filter is active
           ─ Fixed to the bottom-right corner, above all content
           
           TO RESIZE: change --frog-size (width = height of the sprite)
           TO REPOSITION: adjust --frog-right and --frog-bottom
           ───────────────────────────────────────────── */
        #frog-sprite {
            --frog-size:   320px;   /* ← width & height of the frog */
            --frog-right:   45px;   /* ← distance from the right edge of the window */
            --frog-bottom:  10px;   /* ← distance from the bottom edge of the window */

            position: fixed;
            right:   var(--frog-right);
            bottom:  var(--frog-bottom);
            width:   var(--frog-size);
            height:  var(--frog-size);

            /* Sits above gallery cards, modals are z-index 1000 so keep below those */
            z-index: 900;

            cursor: pointer;
            display: none;          /* hidden by default; JS shows it on ceramics filter */
            user-select: none;
            -webkit-user-select: none;
        }

        #frog-sprite img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            /* Crisp pixel-art rendering if the images are pixel-style */
            image-rendering: auto;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 30px;
            }

            header { padding: 20px 24px; }
            nav a { margin-right: 16px; font-size: 0.75rem; }
            h1 { font-size: 2rem; }

            .product-detail {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .modal-content { padding: 30px; }

            .site-footer {
                padding: 18px 30px;
                flex-wrap: wrap;
                gap: 12px;
            }

            /* Slightly smaller frog on mobile — override the custom properties */
            #frog-sprite {
                --frog-size:   150px;
                --frog-right:  16px;
                --frog-bottom: 16px;
            }

              .site-footer .footer-socials img {
            max-height: 10px;
            width: auto;
            object-fit: contain;
            display: block;
            transition: opacity 0.3s;
        }
        }
    </style>

                category: 'drawings',
                soldOut: true 
            },
            { 
                image: 'images/DRAWINGS/Transitions.jpg',
                images: ['images/DRAWINGS/Transitions.jpg'],
                title: 'Transitions', 
                price: 340.00, 
                medium: 'Pencil on paper',
                size: '6x10", 11"x14" framed',
                description: '',
                category: 'drawings',
                soldOut: true 
            },
            { 
                image: 'images/ceramics/mari.png',
                images: ['images/ceramics/butterfly1.webp', 'images/ceramics/butterfly2.webp'],
                title: '', 
                price: 250.00, 
                medium: 'Chocolate Clay',
                size: 'This piece is about 4 inches tall and 2 inches in diameter',
                description: '',
                category: 'ceramics',
                soldOut: true 
            },
            // ── CERAMICS ──
            { 
                image: 'images/ceramics/tea.png',
                images: ['images/ceramics/tea.png', 'images/ceramics/tea-friends.png'],
                title: 'Swamo Party Tea Set', 
                price: 350.00, 
                medium: 'Terra Cotta Red Clay with Cedar Shino GLaze',
                size: 'The teapot is about 4 inches tall and 7 inches in diameter',
                description: '',
                category: 'ceramics',
                soldOut: true 
            },
            { 
                image: 'images/ceramics/dragon2.png',
                images: ['images/ceramics/dragon1.webp'],
                title: 'Sea Dragon Vase', 
                price: 200.00, 
                medium: 'Chocolate Clay with Blue Glaze',
                size: 'This piece is about 3 inches tall and 1.5 inches in diameter',
                description: '',
                category: 'ceramics',
                soldOut: false 
            },
        ];

        let currentFilter = 'all';
        let currentProductIndex = 0;
        let filteredProductsList = [];

        /* ─────────────────────────────────────────────
           FROG ANIMATION CONTROLLER
           ─────────────────────────────────────────────
           TOTAL_FRAMES   : total number of frog frames (frog-1.webp … frog-64.webp)
           ANIMATION_MS   : total playback duration in milliseconds
           FRAME_DIR      : folder where the frames live
           FRAME_PREFIX   : filename prefix before the frame number
           FRAME_EXT      : file extension for the frame images
        */
        const FROG = {
            TOTAL_FRAMES:  64,
            ANIMATION_MS:  4000,
            FRAME_DIR:     'images/frog/',
            FRAME_PREFIX:  'frog-',
            FRAME_EXT:     '.webp',
        };

        const frogSprite  = document.getElementById('frog-sprite');
        const frogImg     = document.getElementById('frog-img');
        let   frogPlaying = false;   // true while the animation is running
        let   frogDone    = false;   // true once played; prevents replay until reset

        /** Build the path for a given 1-based frame index */
        function frogFrameSrc(n) {
            return `${FROG.FRAME_DIR}${FROG.FRAME_PREFIX}${n}${FROG.FRAME_EXT}`;
        }

        /** Show the first frame and make the sprite visible (called when ceramics filter activates) */
        function frogShow() {
            frogDone    = false;
            frogPlaying = false;
            frogImg.src = frogFrameSrc(1);
            frogSprite.style.display = 'block';
        }

        /** Hide the sprite entirely */
        function frogHide() {
            frogSprite.style.display = 'none';
            frogImg.src = '';
        }

        /** Play through all frames once, then hide */
        function frogPlay() {
            if (frogPlaying || frogDone) return;   // ignore if already running or finished
            frogPlaying = true;

            const msPerFrame = FROG.ANIMATION_MS / FROG.TOTAL_FRAMES;
            let frame = 1;

            const tick = setInterval(() => {
                frame++;
                if (frame > FROG.TOTAL_FRAMES) {
                    clearInterval(tick);
                    frogPlaying = false;
                    frogDone    = true;
                    frogHide();   // disappears after the final frame
                    return;
                }
                frogImg.src = frogFrameSrc(frame);
            }, msPerFrame);
        }

        // Click handler on the sprite
        frogSprite.addEventListener('click', frogPlay);

        /* ───────────────────────────────────────────── */

        function applyFilterFromURL() {
            const params = new URLSearchParams(window.location.search);
            const f = params.get('filter');
            if (f && ['all', 'drawings', 'prints', 'ceramics'].includes(f)) {
                currentFilter = f;
            }
        }

        function getFilteredProducts() {
            return currentFilter === 'all' 
                ? products 
                : products.filter(p => p.category === currentFilter);
        }

        function openModal(product, index = 0) {
            currentProductIndex = index;
            filteredProductsList = getFilteredProducts();

            const modalImage = document.getElementById('modalImage');
            const thumbnailsContainer = document.getElementById('imageThumbnails');

            const productImages = product.images || [product.image];
            modalImage.src = productImages[0];
            modalImage.alt = product.title;

            document.getElementById('modalTitle').textContent = product.title.toUpperCase();
            document.getElementById('modalPrice').textContent = `$${product.price.toFixed(2)}`;
            document.getElementById('modalDescription').textContent = product.description || product.title;
            document.getElementById('modalSize').textContent = product.size || '';
            document.getElementById('modalMedium').textContent = product.medium;

            const btn = document.getElementById('modalActionBtn');
            if (product.soldOut) {
                btn.href = SOLD_OUT_URL;
                btn.textContent = 'SOLD OUT - COMMISSION SIMILAR';
                btn.className = 'add-to-cart-btn sold-out-btn';
            } else {
                btn.href = PURCHASE_URL;
                btn.textContent = 'ORDER';
                btn.className = 'add-to-cart-btn';
            }

            thumbnailsContainer.innerHTML = '';
            if (productImages.length > 1) {
                productImages.forEach((imgSrc, i) => {
                    const thumb = document.createElement('div');
                    thumb.className = 'thumbnail' + (i === 0 ? ' active' : '');
                    thumb.innerHTML = `<img src="${imgSrc}" alt="${product.title} - Image ${i + 1}">`;
                    thumb.onclick = () => {
                        modalImage.src = imgSrc;
                        document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
                        thumb.classList.add('active');
                    };
                    thumbnailsContainer.appendChild(thumb);
                });
            }

            document.querySelector('.modal-scrollable').scrollTop = 0;
            updateArrowStates();
            document.getElementById('productModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('productModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            } else if (document.getElementById('productModal').classList.contains('active')) {
                if (e.key === 'ArrowLeft') navigateProduct(-1);
                else if (e.key === 'ArrowRight') navigateProduct(1);
            }
        });

        function navigateProduct(direction) {
            filteredProductsList = getFilteredProducts();
            currentProductIndex += direction;
            if (currentProductIndex < 0) currentProductIndex = filteredProductsList.length - 1;
            else if (currentProductIndex >= filteredProductsList.length) currentProductIndex = 0;
            openModal(filteredProductsList[currentProductIndex], currentProductIndex);
        }

        function updateArrowStates() {
            filteredProductsList = getFilteredProducts();
            const disable = filteredProductsList.length <= 1;
            document.getElementById('modalPrevArrow').classList.toggle('disabled', disable);
            document.getElementById('modalNextArrow').classList.toggle('disabled', disable);
        }

        function filterProducts(category) {
            currentFilter = category;
            const url = new URL(window.location);
            url.searchParams.set('filter', category);
            window.history.replaceState({}, '', url);
            renderGallery();
            document.querySelectorAll('nav a[data-filter]').forEach(link => {
                link.classList.toggle('active', link.dataset.filter === category);
            });

            // Show frog only on ceramics filter; hide on any other filter
            if (category === 'ceramics') {
                frogShow();
            } else {
                frogHide();
            }
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            const filteredProducts = getFilteredProducts();

            filteredProducts.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openModal(product, index);
                card.innerHTML = `
                    <div class="image-container">
                        <img src="${product.image}" alt="${product.title}">
                        ${product.soldOut ? '<div class="sold-out-badge">SOLD OUT</div>' : ''}
                    </div>
                    <div class="product-info">
                        <div class="product-title">${product.title}</div>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                        <div class="product-medium">${product.medium}</div>
                    </div>
                `;
                gallery.appendChild(card);
            });

            document.querySelectorAll('nav a[data-filter]').forEach(link => {
                link.classList.toggle('active', link.dataset.filter === currentFilter);
            });
        }

        // ── Init ──
        applyFilterFromURL();
        renderGallery();

        // Show frog on initial page load if the ceramics filter is already active
        if (currentFilter === 'ceramics') {
            frogShow();
        }

        document.querySelectorAll('nav a[data-filter]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                filterProducts(link.dataset.filter);
            });
        });
    </script>
</body>
</html>
